name: CI

on:
  push:
    # dev 是日常开发分支，直推也要跑检查 —— 别让改动绕过 CI 攒到 merge 时才炸
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 检查 · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
        exclude:
          # Windows 只跑一条：路径/换行这类问题在 node 22 上就会露头，没必要翻倍
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: 装依赖（mineflayer 是插件的直接依赖，会被真拉下来）
        run: npm ci --no-audit --no-fund
      - name: 语法 + 动态 import + 私有字段一致性
        run: node tools/check-core.mjs
      - name: 离线回归套件（280+ 断言，不需要 MC 服务器、不连网）
        run: node selfcheck.mjs

  package:
    name: 打包产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 发布前必须全绿
        run: node tools/check-core.mjs && node selfcheck.mjs
      - name: npm pack
        run: npm pack
      - name: 核对 tarball 该有的都有、不该有的都没有
        run: |
          set -euo pipefail
          tar -tzf whale_craft-*.tgz | sort > files.txt
          cat files.txt
          for f in package/index.js package/client.js package/selfcheck.mjs \
                   package/cordis.patch.yml package/LICENSE package/README.md \
                   package/tools/check-core.mjs; do
            grep -qx "$f" files.txt || { echo "::error::tarball 缺文件：$f"; exit 1; }
          done
          if grep -qE 'node_modules|/logs/|accounts\.json|config\.json|\.whale-craft' files.txt; then
            echo "::error::tarball 里混进了运行期产物"; exit 1
          fi
      - name: 干净环境回归（pack → 独立目录 npm install → import('whale_craft') 必须成功）
        # 本机/CI 的 link 安装永远测不出「宿主包解析不到」（GitHub issue #5），只有干净安装能复现用户环境。
        # 反证：把 index.js 改回静态 import 两个宿主包，这一步必须变红。
        run: node tools/check-standalone-import.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: whale_craft-tarball
          path: '*.tgz'
          if-no-files-found: error
