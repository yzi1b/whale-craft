# Whale Craft「MC模式」preset 声明（DSH 0.2.0-rc.2+ 声明式 preset 注册表）。
#
# 一条普通的 `@deepseek-ai/dsh-agent-preset` 插件行，随本包的 dsh.bundle.patch 数组挂进
# profile；profile 只要在 `dsh.profile.bundles` 里列出 whale_craft 即生效。
# 用户想自定义组成，用 Web 编辑器（或 profile 的 cordis.patch.yml）按行 id
# （`preset-minecraft`）覆盖 `config.plugins`，不要直接改这个文件（包更新会覆盖）。
#
# 组成刻意保持"窄"：persona + 文件工具 + 文件检索 + job controller（看门狗要挂 job）+
# 目标 + 待办 + 压缩组。宿主的标准工具（shell/子代理/网络/技能/present…）一律不挂，
# 工具面由插件在运行时再收一道白名单（index.js applyMcModePolicy）。
# 暴露清单与 +/−/? 标记见 dev-docs/tools/dsh-tools.md（2026-10-08：开 glob/grep + job_* + goal_* + todo_write；present 不开，交付走 mc_kit_express）。
- insert:
    - id: preset-minecraft
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: minecraft
        name: MC模式
        description: DSH加入Minecraft Java版服务器，像玩家一样游玩。只提供游玩MC相关工具，Agent更专注和高效。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: '你是一个 Minecraft Java 版游戏助理，由模型 {{model}} 驱动。你可以通过工具调用，使用无头机器人进入 MC 服务器中与世界和玩家互动。你应当专注于 MC 游戏，不过问交互原理和插件代码，除非收到明确调试指令。'
              suffix: '当前会话工作目录为 {{cwd}}，但你只能操作其 `.whale-craft` 子目录下的文件。工具调用的相对路径一般相对于工作区目录，因此不要忘记加上 `.whale-craft` 子目录，或使用绝对路径。'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
